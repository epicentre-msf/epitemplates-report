title: Report
version: 1.0.0
quarto-required: ">=1.8.24"
contributes:
  metadata:
    project:
      brand: brand.yml
  format:
    html:
      theme:
        - cosmo
        - css/epicentre_qmd_style.scss
      template-partials:
        - partials/title-block.html
      title-block-banner: true
      logo: img/epicentre_msf_logo_transparent.png
      embed-resources: true
      filters:
        - scripts/validate-logo.lua
      smooth-scroll: true
      code-fold: show
      code-tools: false
      toc: true
      toc-location: left
      toc-float: true
      toc-collapsed: true
      callout-appearance: minimal
    revealjs:
      theme:
        - default
        - css/epicentre_revealjs_style.scss
      logo: img/epicentre_msf_logo_transparent.png
      incremental: false
      slide-number: c/t
      overview: true
      progress: true
      embed-resources: true
      filters:
        - scripts/validate-logo.lua
    pptx:
      incremental: true
      reference-doc: pptx/epicentre-pptx-template.pptx
    pdf:
      toc: true
      papersize: a4paper
      documentclass: scrartcl
      include-in-header:
        - pdf/header.tex
      classoption: oneside
      filters:
        - scripts/validate-logo.lua
        - scripts/inject-pdf-logo.lua
        - scripts/inject-brand-colors.lua
    docx:
      reference-doc: docx/reference.docx 